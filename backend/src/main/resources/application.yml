server:
  port: 8080
  servlet:
    context-path: /api

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/aryan_travels
      database: aryan_travels
  
  application:
    name: aryan-travels-backend

# JWT Configuration
jwt:
  secret: aryanTravelsSecretKeyForJWTTokenGeneration2024
  expiration: 86400000 # 24 hours in milliseconds

# CORS Configuration
cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Logging
logging:
  level:
    com.aryantravels: DEBUG
    org.springframework.security: DEBUG
